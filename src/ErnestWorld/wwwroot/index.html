<!DOCTYPE html>
<!--
  LE MONDE D'ERNEST · portfolio et blog d'Ernest Afaton
  Application C# (Blazor WebAssembly) + île en 3D (Three.js).
  Code source : https://github.com/ernestjesutinafaton-maker/ernestjesutinafaton-maker.github.io
-->
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Le Monde d'Ernest · Portfolio et blog d'Ernest Afaton</title>
    <base href="/" />

    <meta name="description" content="Portfolio et blog interactifs en 3D d'Ernest Afaton, étudiant en 2e année de Bachelor Informatique à l'EPSI Lyon. Explore l'île : chaque bâtiment est un projet, une compétence ou une étape de son parcours." />
    <meta name="theme-color" content="#0b0a12" />
    <meta property="og:title" content="Le Monde d'Ernest · Portfolio et blog en 3D" />
    <meta property="og:description" content="Une île en 3D à explorer : projets, compétences, formation et le Journal d'Ernest Afaton." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ernestjesutinafaton-maker.github.io/" />
    <link rel="alternate" type="application/rss+xml" title="Le Journal d'Ernest" href="rss.xml" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23D946EF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-weight='700' font-size='26' fill='white'%3EEA%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/journal.css" />
    <link rel="stylesheet" href="css/battle.css" />
    <link rel="modulepreload" href="lib/three/three.module.js" />
    <script type="importmap"></script>

    <!--
      GitHub Pages ne connaît pas les adresses du site (/journal/...) : il renvoie 404.html,
      qui redirige vers /?p=journal/... Ce script remet la bonne adresse avant le démarrage de Blazor.
    -->
    <script>
        (function () {
            var p = new URLSearchParams(window.location.search).get("p");
            if (p) {
                window.history.replaceState(null, "", document.baseURI.replace(/\/$/, "") + "/" + p.replace(/^\//, ""));
            }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <p class="boot-title">Le Monde<br /><span>d'Ernest</span></p>
            <div class="boot-bar"><span></span></div>
            <p class="boot-text">Construction de l'île</p>
        </div>
    </div>

    <noscript>
        <div class="boot">
            <p>Ce site a besoin de JavaScript.</p>
            <p><a href="classique/">Voir la version classique du portfolio</a></p>
        </div>
    </noscript>

    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss" role="button" aria-label="Fermer">×</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
