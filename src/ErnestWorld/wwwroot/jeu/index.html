    <!--
      GitHub Pages ne connaît pas les adresses du jeu (/journal/...) : il renvoie 404.html,
      qui redirige vers /jeu/?p=journal/... Ce script remet la bonne adresse avant le démarrage de Blazor.
      Il traduit aussi l'écran de chargement si le visiteur a choisi l'anglais.
    -->
    <script>
        (function () {
            var p = new URLSearchParams(window.location.search).get("p");
            if (p) {
                window.history.replaceState(null, "", document.baseURI.replace(/\/$/, "") + "/" + p.replace(/^\//, ""));
            }
            var lang = new URLSearchParams(window.location.search).get("lang");
            try { lang = lang || localStorage.getItem("ernest-lang"); } catch (e) { }
            if (lang !== "fr" && lang !== "en") lang = /^fr/i.test(navigator.language || "fr") ? "fr" : "en";
            document.documentElement.lang = lang;
            document.documentElement.setAttribute("data-lang", lang);
        })();
    </script>
    <style>
        html[data-lang="en"] :is(.boot, #blazor-error-ui) [lang="fr"],
        html:not([data-lang="en"]) :is(.boot, #blazor-error-ui) [lang="en"] { display: none; }
    </style>
</head>

<body>

        <div class="boot">

    </div>

</body>
